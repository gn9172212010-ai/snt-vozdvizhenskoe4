backend:
  name: github
  repo: gn9172212010-ai/snt-vozdvizhenskoe4
  branch: main
  # После деплоя воркера (см. cloudflare-oauth-worker/README.md) заменить
  # на свой реальный адрес, БЕЗ /callback на конце:
  base_url: https://ЗАМЕНИ-НА-СВОЙ-АДРЕС.workers.dev

media_folder: public/uploads
public_folder: /uploads

locale: ru

collections:

  - name: news
    label: Новости

    folder: src/content/news

    create: true

    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:

      - { label: Заголовок, name: title, widget: string }

      - { label: Дата, name: date, widget: datetime }

      - { label: Краткое описание, name: description, widget: text }

      - { label: Текст новости, name: body, widget: markdown }



  - name: events

    label: Мероприятия

    folder: src/content/events

    create: true

    fields:

      - { label: Событие, name: title, widget: string }

      - { label: Дата, name: date, widget: datetime }

      - { label: Описание, name: body, widget: markdown }

  - name: contacts

    label: Контакты

    files:

      - label: Контакты СНТ

        name: contacts

        file: src/data/contacts.json

        fields:

          - { label: Председатель, name: chairman, widget: string }

          - { label: Телефон, name: phone, widget: string }

          - { label: Email, name: email, widget: string }

  - name: announcement

    label: Важная информация (главная страница)

    files:

      - label: Баннер важной информации

        name: announcement

        file: src/data/announcement.json

        fields:

          - { label: Показывать баннер, name: enabled, widget: boolean, default: true }

          - { label: Текст объявления, name: text, widget: text }

          - { label: Ссылка кнопки (например /payments), name: linkHref, widget: string }

          - { label: Текст кнопки, name: linkLabel, widget: string }

  - name: gallery

    label: Фотографии

    folder: public/uploads/photos

    create: true

    fields:

      - { label: Название, name: title, widget: string }

      - { label: Фото, name: image, widget: image }